@if (showModal) {
  <div class="h-max w-max bg-gray-600 text-white p-10 rounded-2xl flex flex-col space-y-4">
      <div class="text-xl text-center">Anmeldeformular</div>
      <div>
        <form t>
          <div class="flex flex-col space-y-5">
            <div class="flex flex-col">
              <label for="name">Name</label>
              <input id="name" class="bg-gray-700 border border-1 p-2 rounded-2xl" type="text">
            </div>

            <div class="flex flex-col">
              <label for="passwordField">Passwort</label>
              <input id="passwordField" class="bg-gray-700 border border-1 p-2 rounded-2xl" type="password">
            </div>
            <div class="flex justify-evenly">
              <button class="p-1 mx-2 text-l bg bg-sky-500 hover:bg-sky-700 text-white rounded-2xl w-40 text-center" type="submit">Bestätigen</button>
              <button class="p-1 mx-2 text-l bg bg-red-500 hover:bg-red-700 text-white rounded-2xl w-40 text-center" (click)="close()">Abbrechen</button>
            </div>
          </div>
        </form>
      </div>
  </div>
}
